[project]
name = "healthcareai-cloudflare"
version = "1.0.0"
description = "HealthCareAI Django backend for Cloudflare Python Workers"
requires-python = ">=3.13"
dependencies = [
  "Django>=5.0,<6.0",
  "django-cf",
  "djangorestframework>=3.15",
  "djangorestframework-simplejwt>=5.3",
  "django-cors-headers>=4.4",
  "requests>=2.31",
]

[dependency-groups]
dev = ["workers-py", "workers-runtime-sdk"]
