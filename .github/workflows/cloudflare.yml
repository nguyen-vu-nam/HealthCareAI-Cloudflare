name: HealthCareAI - Validate and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy Worker after validation (requires D1 schema already initialized)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: healthcareai-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14.2"
          enable-cache: true

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Vendor Python dependencies for Workers
        run: uv run pywrangler sync

      - name: Compile backend
        run: uv run python -m compileall -q backend

      - name: Django system checks
        env:
          PYTHONPATH: backend
          DJANGO_SECRET_KEY: ci-only-not-for-deployment
          DJANGO_DEBUG: "true"
        run: uv run python backend/manage.py check

  deploy:
    name: Deploy to Cloudflare
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14.2"
          enable-cache: true

      - name: Install Wrangler
        run: npm install --global wrangler@4.168.0

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Install Python Worker dependencies
        run: uv sync --group dev

      - name: Vendor Python dependencies for Workers
        run: uv run pywrangler sync

      - name: Validate required deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$DJANGO_SECRET_KEY" || (echo "Missing DJANGO_SECRET_KEY" && exit 1)

      - name: Upload Django secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        run: printf '%s' "$DJANGO_SECRET_KEY" | wrangler secret put DJANGO_SECRET_KEY --config wrangler.jsonc

      - name: Upload optional AI secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_API_BASE_URL: ${{ secrets.AI_API_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: |
          if [ -n "$AI_API_BASE_URL" ]; then printf '%s' "$AI_API_BASE_URL" | wrangler secret put AI_API_BASE_URL --config wrangler.jsonc; fi
          if [ -n "$AI_API_KEY" ]; then printf '%s' "$AI_API_KEY" | wrangler secret put AI_API_KEY --config wrangler.jsonc; fi
          if [ -n "$AI_MODEL" ]; then printf '%s' "$AI_MODEL" | wrangler secret put AI_MODEL --config wrangler.jsonc; fi

      - name: Deploy Python Worker and frontend assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run pywrangler deploy
